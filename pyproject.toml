[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "adaptive-fractionation-overlap"
version = "0.1.0"
description = "Adaptive fractionation for PTV-OAR overlap scenarios"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Yoel Pérez Haas", email = "yoel.perezhaas@usz.ch" }
]
license = { text = "MIT" }
keywords = [
    "python",
    "adaptive fractionation",
    "radiotherapy",
    "medical",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Healthcare Industry",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
]

dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "matplotlib>=3.7",
    "pandas>=2.0",
]

[project.optional-dependencies]
app = [
    "streamlit",
]
test = [
    "pytest>=7",
    "pytest-cov>=4",
]
dev = [
    "pytest>=7",
    "pytest-cov>=4",
    "black",
    "flake8",
    "streamlit",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["adaptive_fractionation_overlap*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = ["-v", "--tb=short"]
markers = [
    "unit: Unit tests for individual functions",
    "integration: Integration tests for multiple components", 
    "slow: Tests that take longer to run"
]